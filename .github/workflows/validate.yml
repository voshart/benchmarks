name: Validate and build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Check formatting with actionable diff
        run: npm run format && git diff --exit-code
      - run: npm run build
      - name: Audit OCR comparisons and component coverage
        run: |
          node scripts/audit-ocr-ranking.cjs
          node scripts/audit-ocr-dimensions.cjs
